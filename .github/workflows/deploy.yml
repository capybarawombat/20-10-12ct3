name: Deploy the wishing garden
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - uses: actions/configure-pages@v5
        id: pages
      - run: sudo apt-get update && sudo apt-get install -y qrencode python3-pil fonts-dejavu
      - name: Generate production QR and social metadata
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run qr -- "${SITE_URL%/}/"
      - name: Build for repository path
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test the production repository mount point
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run test:e2e
      - name: Retain browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
